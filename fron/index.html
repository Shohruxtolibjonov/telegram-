<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Educational Games Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="container hidden">
        <div class="header">
            <h1>🎮 Educational Games</h1>
            <div class="user-info">
                <span id="userName"></span>
                <span id="proBadge" class="pro-badge hidden">⭐ PRO</span>
            </div>
        </div>

        <div class="main-buttons">
            <button class="btn btn-primary" onclick="showMyGames()">
                📚 O'yinlarim / My Games
            </button>
            <button class="btn btn-success" onclick="showCreateGame()">
                ➕ O'yin yaratish / Create Game
            </button>
        </div>

        <!-- Admin Panel (Only for admins) -->
        <div id="adminPanel" class="admin-panel hidden">
            <h2>👨‍💼 Admin Panel</h2>
            <div class="admin-stats">
                <div class="stat-card">
                    <h3 id="totalUsers">0</h3>
                    <p>Total Users</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalGames">0</h3>
                    <p>Total Games</p>
                </div>
            </div>
        </div>
    </div>

    <!-- My Games View -->
    <div id="myGamesView" class="container hidden">
        <button class="btn btn-back" onclick="showDashboard()">← Back</button>
        <h2>📚 My Games</h2>
        <div id="gamesList" class="games-list"></div>
    </div>

    <!-- Create Game View -->
    <div id="createGameView" class="container hidden">
        <button class="btn btn-back" onclick="showDashboard()">← Back</button>
        <h2>➕ Create New Game</h2>
        
        <div class="form-group">
            <label>Game Type:</label>
            <select id="gameType" onchange="checkProAccess(this.value)">
                <optgroup label="Free Games">
                    <option value="rise_up">Rise Up - Pillar Climbing</option>
                    <option value="tug_of_war">Tug of War (Arqon)</option>
                    <option value="jump">Jump - Sack Race</option>
                    <option value="wheel_fortune">Wheel of Fortune</option>
                    <option value="quiz_master">Quiz Master</option>
                </optgroup>
                <optgroup label="PRO Games 🔒">
                    <option value="moto_tug">Moto Tug of War 🔒</option>
                    <option value="adventure">Adventure (Sarguzasht) 🔒</option>
                    <option value="penguin_race">Penguin Race 🔒</option>
                    <option value="tractor_pull">Tractor Pull 🔒</option>
                    <option value="auto_racing">Auto Racing 🔒</option>
                    <option value="water_moto">Water Moto 🔒</option>
                    <option value="swimming">Swimming (Suzish) 🔒</option>
                    <option value="memory_match">Memory Match 🔒</option>
                    <option value="word_search">Word Search 🔒</option>
                    <option value="hangman">Hangman 🔒</option>
                    <option value="flashcards">Flashcards 🔒</option>
                    <option value="crossword">Crossword 🔒</option>
                    <option value="hidden_object">Hidden Object 🔒</option>
                    <option value="categorization">Categorization Game 🔒</option>
                    <option value="sequence_order">Sequence Order 🔒</option>
                </optgroup>
            </select>
        </div>

        <div id="proWarning" class="pro-warning hidden">
            <p>🔒 This is a PRO feature. Request access from admin.</p>
            <button class="btn btn-warning" onclick="requestProAccess()">Request PRO Access</button>
        </div>

        <div id="gameForm">
            <div class="form-group">
                <label>Game Title:</label>
                <input type="text" id="gameTitle" placeholder="Enter game title">
            </div>

            <div class="form-group">
                <label>Questions (One per line, format: Question | Answer1 | Answer2 | Answer3 | Answer4 | CorrectNumber):</label>
                <textarea id="questions" rows="8" placeholder="What is 2+2? | 3 | 4 | 5 | 6 | 2"></textarea>
            </div>

            <button class="btn btn-success" onclick="createGame()">Create & Share</button>
        </div>
    </div>

    <!-- Game Play View -->
    <div id="gamePlayView" class="container hidden">
        <button class="btn btn-back" onclick="showDashboard()">← Exit Game</button>
        <div id="gameCanvas"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
